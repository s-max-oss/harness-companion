# adapters/codex/adapter.conf — Codex adapter metadata (Phase 5b)
#
# Phase 5b: Real Codex plugin/hooks integration validated against
# validate_plugin.py and the Codex CLI hook protocol. SessionStart
# injects status via hookSpecificOutput.additionalContext; Stop emits
# handoff warnings via systemMessage; PreToolUse exits permissively
# with "policy not enabled" notice.
#
# Format: key=value. Lines beginning with # are comments.

name=codex
display_name=Codex OS
status=supported

protocol_version=1

# Knowledge + progress file mapping (Codex default is AGENTS.md)
knowledge_entry=AGENTS.md
progress_file=codex-progress.md

# Capability flags
has_session_start_hook=true
has_stop_hook=true
has_user_prompt_submit_hook=false
has_pre_tool_use_hook=true
has_post_tool_use_hook=false
has_pre_compact_hook=false

# Hook implementation
hook_runtime=bash
hook_directory=hooks
has_command_windows=true
command_windows_requires_bash=true

# Degradation (per §14.4: commandWindows depends on Bash runtime)
fallback_workflow=explicit
windows_sandbox_degraded=true

# Install modes
plugin_config_type=hooks_json
repo_local_config_type=hooks_json
user_inline_config_type=config_toml

# PreToolUse status
pretooluse_status=policy_not_enabled
pretooluse_behavior=permissive_allow_all
